<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>SALTLINE | 솔트라인</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f}iframe{display:block;width:100%;height:100%;border:0}</style></head><body>
<iframe id="game" src="./game-original.html" allow="fullscreen; autoplay; gamepad" title="솔트라인 게임"></iframe>
<script>
(()=>{const dict={
'Raising the terminal':'게임을 준비하는 중','Objective':'목표','Relays':'중계기','Vitals':'상태','Control':'조작','Weak point':'약점',
'Move':'이동','Look':'시점 이동','Mouse':'마우스','Fire':'발사','Left button':'왼쪽 버튼','Aim':'조준','Right button':'오른쪽 버튼','Reload':'재장전','Swap weapon':'무기 변경','wheel, or':'휠 또는','Cut relay':'중계기 차단','Hold':'길게 누르기','Jump':'점프','Space':'스페이스','Sprint':'질주','Shift':'쉬프트','Crouch':'웅크리기','Ctrl':'컨트롤','Melee':'근접 공격','Pause':'일시정지','Esc':'ESC',
'Port Authority Breach Unit':'항만 보안 돌입 부대','Saltline Terminal · 05:42':'솔트라인 터미널 · 05:42','The port’s security net has gone feral. Cut its three uplinks. Reach the boat.':'항만 보안망이 통제 불능 상태입니다. 연결 장치 3개를 차단하고 보트에 도달하십시오.','Deploy':'작전 시작','Settings':'설정','Controls':'조작법','Mode':'모드','Difficulty':'난이도','Every surface, machine and sound is generated in your browser. Nothing is downloaded.':'모든 지형, 기계, 사운드는 브라우저에서 생성됩니다. 별도 다운로드는 없습니다.',
'LMB':'마우스 왼쪽','RMB':'마우스 오른쪽','Sidearm':'보조 무기','Controller':'컨트롤러','Sticks move and look':'스틱으로 이동 및 시점 조작','Reload / cut':'재장전 / 차단','Touch':'터치','Left thumb moves':'왼쪽 엄지로 이동','Right thumb looks':'오른쪽 엄지로 시점 조작','Fire · Aim · Reload · Jump on screen':'화면 버튼으로 발사 · 조준 · 재장전 · 점프',
'A note from Felix':'개발자 노트','Dismiss this note':'노트 닫기','Hi, Felix here. People online were impressed with the one-shotted version of this game - Claude Fable 5.2 built something pretty good without any human feedback. However, I really wanted to fix the weapon models, sounds, and some gameplay work. I spent an additional two hours to improve this game.':'안녕하세요, 개발자 Felix입니다. 초기 버전은 별도의 사용자 피드백 없이 제작되었습니다. 이후 무기 모델과 사운드, 게임플레이를 개선했습니다.','If you\'d rather see the first version that didn\'t receive any human feedback, click here:':'초기 버전을 확인하려면 아래를 누르세요.','See the one-shotted version':'초기 버전 보기',
'Operation on hold':'작전 일시 중지','Paused':'일시정지','Resume':'계속하기','Restart mission':'임무 재시작','Breacher down':'작전 요원 전투 불능','Signal lost':'신호 두절','Time survived':'생존 시간','Relays cut':'차단한 중계기','Waves cleared':'정리한 웨이브','Machines destroyed':'파괴한 기계','Score':'점수','Best':'최고 기록','Retry':'다시 시도','Berth 4 · Debrief':'4번 선석 · 작전 결과','Saltline is dark':'솔트라인 보안망 차단 완료','Rating':'등급','Clean':'완벽','Time':'시간','Accuracy':'명중률','Retries':'재시도 횟수','Redeploy':'재투입','Close':'닫기','Weapon position':'무기 위치','Graphics quality':'그래픽 품질','Mouse sensitivity':'마우스 감도','Invert Y':'Y축 반전','Off':'끄기','Master volume':'전체 음량','Field of view':'시야각','Display':'화면','Enter fullscreen':'전체 화면','Keyboard · Mouse':'키보드 · 마우스',
'CREATE A ROOM OR JOIN AN EXISTING SESSION':'방을 만들거나 기존 방에 참가하세요','CALLSIGN / NICKNAME':'닉네임','ROOM CODE (6 CHARACTERS)':'방 코드 (6자리)','CREATE ROOM':'방 만들기','JOIN ROOM':'방 참가','◉ ONLINE / SOLO':'◉ 온라인 / 솔로','SALTLINE // NETWORK':'SALTLINE // 온라인','Offline · Single-player mode':'오프라인 · 싱글 플레이'
};
function translate(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let t=n.nodeValue.trim();if(dict[t])n.nodeValue=n.nodeValue.replace(t,dict[t]);}for(const el of root.querySelectorAll?root.querySelectorAll('*'):[]){for(const a of ['placeholder','aria-label','title']){let v=el.getAttribute(a);if(v&&dict[v])el.setAttribute(a,dict[v]);}}}
function install(){const f=document.getElementById('game');try{const d=f.contentDocument;if(!d||!d.body)return false;d.documentElement.lang='ko';const run=()=>translate(d.body);run();new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='childList')m.addedNodes.forEach(n=>{if(n.nodeType===1)translate(n);else if(n.nodeType===3&&n.parentElement)translate(n.parentElement)});else if(m.target.parentElement)translate(m.target.parentElement)})).observe(d.body,{subtree:true,childList:true,characterData:true});return true}catch(e){return false}}
document.getElementById('game').addEventListener('load',()=>{let i=0;const t=setInterval(()=>{if(install()||++i>30)clearInterval(t)},250)});})();
</script></body></html>
